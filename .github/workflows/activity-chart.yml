
name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity charts
        uses: dturovskiy/deus-commit-chart@v1.5.3
        with:
          username: Nithish-1622
          token: ${{ secrets.GITHUB_TOKEN }}
          default-days: "30"
          ranges: "30,90,365"
          layout: spacious
          output-dir: activity-dist

      - name: Publish charts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./activity-dist
          publish_branch: activity-assets
          force_orphan: true
